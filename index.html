<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Noel Clark | Plant Your Flag</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/typography.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/hero.css" />
    <link rel="stylesheet" href="css/social.css" />
    <link rel="stylesheet" href="css/arrival.css" />
    <link rel="stylesheet" href="css/home.css" />
  </head>

  <body>
    <main id="experience">
      <!-- Scene 01 -->

      <section id="scene-01" class="scene hero">
        <div class="hero-inner">
          <h1 class="hero-title">PLANT YOUR FLAG</h1>
        </div>
      </section>

      <!-- Scene 02 -->

      <section id="scene-02" class="scene social">
        <article class="social-post">
          <header class="social-header">
            <div class="story-ring-wrapper">
              <div class="ring-light"></div>

              <button class="story-ring" aria-label="Open Story">
                <img
                  src="assets/noel-profile-bw.jpg"
                  alt="Portrait of Noèl Clark"
                />
              </button>
            </div>

            <div class="profile">
              <h2>@noelclarkdotcom</h2>

              <span>NOÈL CLARK</span>
            </div>
          </header>

          <div class="memory-scene">
            <div class="narrative-voice">
              <p class="social-text">
                There was a time when the internet felt like wandering into
                someone's world...
              </p>

              <p class="social-text" aria-hidden="true">
                NoelClark.com has been my home on the internet since 2010.
              </p>

              <p class="social-text" aria-hidden="true">
                It was just me and my open journal...
              </p>
            </div>

            <figure class="home-memory" aria-hidden="true">
              <img
                src="assets/images/wayback-01.jpg"
                alt="An early NoelClark.com homepage screen from 2012 declaring purpose to honor late father's life and help others."
              />
            </figure>
          </div>
        </article>
      </section>
      <!-- Scene 03 -->

      <section id="scene-03" class="scene home">
        <div class="home-world">
          <div class="thread"></div>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="js/world.js"></script>
    <script src="js/arrival.js"></script>
  </body>
</html>
