<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Arrival Prototype</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="stage">
      <section class="social-post">
        <div class="post-header">
          <div class="story-ring-wrapper">
            <div class="ring-light"></div>

            <button class="story-ring" aria-label="Open Story">
              <img src="assets/noel-profile-bw.jpg" alt="Noèl Clark" />
            </button>
          </div>

          <div class="identity">
            <h2>@noelclarkdotcom</h2>

            <p>NOÈL CLARK</p>
          </div>

          <div class="post-meta">
            <span>2m</span>

            <button class="menu-button" aria-label="More options">•••</button>
          </div>
        </div>

        <div class="post-body">
          <p>
            There was a time when the internet felt like wandering into
            someone's world...
          </p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
